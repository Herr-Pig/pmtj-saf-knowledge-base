<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">磁反转事件场的概念示意</title><desc id="desc">左侧为主回线，右侧为minor loop；标注事件场、中心和半宽，用于说明不同定义不能混用。</desc>
<rect width="1120" height="430" rx="18" fill="#f7f9fc"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324a">磁反转读图：事件场、回线中心与半宽</text>
<g stroke="#64748b" stroke-width="1.5" fill="none"><path d="M70 210 H500 M285 80 V355"/><path d="M620 210 H1050 M835 80 V355"/></g>
<g font-family="Arial,sans-serif" font-size="14" fill="#526579"><text x="465" y="235">H</text><text x="290" y="92">M</text><text x="1015" y="235">H</text><text x="840" y="92">m</text></g>
<path d="M100 300 C165 300 200 295 220 270 S250 230 265 210 S280 180 300 150 S335 120 470 120" stroke="#2563eb" stroke-width="4" fill="none"/>
<path d="M100 120 C200 120 240 125 260 150 S280 190 300 210 S330 250 350 270 S390 300 470 300" stroke="#dc2626" stroke-width="4" fill="none"/>
<g stroke="#0f766e" stroke-width="2" stroke-dasharray="5 5"><path d="M265 210 V340"/><path d="M350 210 V340"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#0f766e"><text x="218" y="365">事件场 H₁</text><text x="330" y="365">事件场 H₂</text></g>
<path d="M670 270 C720 270 745 260 770 230 S795 180 835 170 S880 180 900 220 S930 270 1000 270" stroke="#7c3aed" stroke-width="4" fill="none"/>
<g stroke="#0f766e" stroke-width="2" stroke-dasharray="5 5"><path d="M770 210 V330"/><path d="M900 210 V330"/></g><path d="M770 315 H900" stroke="#0f766e" stroke-width="2"/><path d="M770 315 l10 -5 v10 z M900 315 l-10 -5 v10 z" fill="#0f766e"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#0f766e"><text x="755" y="350">Hdown</text><text x="887" y="350">Hup</text><text x="795" y="300">中心 / 半宽</text></g>
<text x="285" y="395" font-family="Arial,sans-serif" font-size="14" fill="#526579" text-anchor="middle">主回线事件场不能自动等同于耦合场</text><text x="835" y="395" font-family="Arial,sans-serif" font-size="14" fill="#526579" text-anchor="middle">minor-loop 定义须按原文约定使用</text>
</svg>